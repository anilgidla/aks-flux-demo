apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-helm
  namespace: flux-helm-demo
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/nginx-demo
      sourceRef:
        kind: GitRepository
        name: temporal-demo
        namespace: flux-system
      interval: 5m
  values:
    replicaCount: 3
    image:
      repository: nginx
      tag: "1.27"
    service:
      type: ClusterIP
      port: 80
