apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helm-demo
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: flux-demo

  chart:
    spec:
      chart: ./charts/helm-demo
      sourceRef:
        kind: GitRepository
        name: temporal-demo
        namespace: flux-system
      interval: 5m

  values:
    replicaCount: 2

    image:
      repository: nginx
      tag: "1.27"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 80
